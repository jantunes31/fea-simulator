<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Testudo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5a8c"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="scutum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c62828"/>
      <stop offset="55%" stop-color="#8e0000"/>
      <stop offset="100%" stop-color="#5c0000"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- Roof of interlocking rectangular scuta (3x3 top + side walls) -->
  <g transform="translate(56,70)">
    <!-- Top face (perspective-ish rows) -->
    <g>
      <!-- row 1 -->
      <rect x="40" y="20" width="100" height="70" rx="6" fill="url(#scutum)" stroke="#ffd54f" stroke-width="4"/>
      <rect x="150" y="20" width="100" height="70" rx="6" fill="url(#scutum)" stroke="#ffd54f" stroke-width="4"/>
      <rect x="260" y="20" width="100" height="70" rx="6" fill="url(#scutum)" stroke="#ffd54f" stroke-width="4"/>
      <!-- row 2 -->
      <rect x="40" y="100" width="100" height="70" rx="6" fill="url(#scutum)" stroke="#ffd54f" stroke-width="4"/>
      <rect x="150" y="100" width="100" height="70" rx="6" fill="url(#scutum)" stroke="#ffd54f" stroke-width="4"/>
      <rect x="260" y="100" width="100" height="70" rx="6" fill="url(#scutum)" stroke="#ffd54f" stroke-width="4"/>
      <!-- row 3 -->
      <rect x="40" y="180" width="100" height="70" rx="6" fill="url(#scutum)" stroke="#ffd54f" stroke-width="4"/>
      <rect x="150" y="180" width="100" height="70" rx="6" fill="url(#scutum)" stroke="#ffd54f" stroke-width="4"/>
      <rect x="260" y="180" width="100" height="70" rx="6" fill="url(#scutum)" stroke="#ffd54f" stroke-width="4"/>
    </g>
    <!-- Boss dots (gold umbones) -->
    <g fill="#ffd54f">
      <circle cx="90" cy="55" r="8"/><circle cx="200" cy="55" r="8"/><circle cx="310" cy="55" r="8"/>
      <circle cx="90" cy="135" r="8"/><circle cx="200" cy="135" r="8"/><circle cx="310" cy="135" r="8"/>
      <circle cx="90" cy="215" r="8"/><circle cx="200" cy="215" r="8"/><circle cx="310" cy="215" r="8"/>
    </g>
    <!-- Front wall scuta (hanging down) -->
    <rect x="40" y="260" width="100" height="90" rx="6" fill="url(#scutum)" stroke="url(#rim)" stroke-width="4"/>
    <rect x="150" y="260" width="100" height="90" rx="6" fill="url(#scutum)" stroke="url(#rim)" stroke-width="4"/>
    <rect x="260" y="260" width="100" height="90" rx="6" fill="url(#scutum)" stroke="url(#rim)" stroke-width="4"/>
    <g fill="#ffd54f">
      <circle cx="90" cy="300" r="8"/><circle cx="200" cy="300" r="8"/><circle cx="310" cy="300" r="8"/>
    </g>
    <!-- Side accents -->
    <rect x="0" y="40" width="32" height="280" rx="4" fill="#8e0000" stroke="#c9a227" stroke-width="3"/>
    <rect x="368" y="40" width="32" height="280" rx="4" fill="#8e0000" stroke="#c9a227" stroke-width="3"/>
  </g>
</svg>
